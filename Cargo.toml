[package]
name = "quicssh-rs"
version = "0.1.5"
edition = "2024"
license = "MIT"
authors = ["oowl <ouyangjun1999@gmail.com>"]
description = "A simple ssh server based on quic protocol"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aws-lc-rs = "1.19.0"
clap = { version = "4.6.1", features = ["derive"] }
quinn = { version = "0.11.9", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
tokio = { version = "1.52.3", features = ["full"] }
url = "2.5.8"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std"] }
rustls-platform-verifier = "0.7.1"
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
subtle = "2.6.1"
log = { version = "0.4.29", features = ["std", "serde"] }
log4rs = { version = "1.4.0", default-features = false, features = ["console_appender", "file_appender", "pattern_encoder"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

[package.metadata.deb]
extended-description = """\
:) quicssh-rs is a QUIC proxy that allows to use QUIC to connect to an SSH server without needing to patch the client or the server."""
section = "net"
priority = "optional"
suggests = "openssh-server"
